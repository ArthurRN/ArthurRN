# Gera os cards de estatísticas e a cobrinha do perfil.
# Salve no repositório ArthurRN/ArthurRN em: .github/workflows/perfil.yml
name: Atualizar cards do perfil

on:
  schedule:
    - cron: "0 */12 * * *"   # atualiza a cada 12 horas
  workflow_dispatch:          # botão "Run workflow" na aba Actions

permissions:
  contents: write

jobs:
  cards:
    name: Cards de estatísticas e linguagens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

  cobrinha:
    name: Cobrinha das contribuições
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#EA580C
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F97316
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
